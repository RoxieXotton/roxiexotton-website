<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music | Roxie Xotton</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      padding: 40px 20px;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    p, li {
      color: #ddd;
      line-height: 1.7;
    }
    .card {
      background: #111;
      border: 1px solid #300;
      border-radius: 12px;
      padding: 24px;
      margin-top: 20px;
    }
    .track {
      padding: 14px 0;
      border-bottom: 1px solid #222;
    }
    .track:last-child {
      border-bottom: none;
    }
    a {
      color: #f66;
      text-decoration: none;
    }
    .back {
      display: inline-block;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Back</a>
    <h1>MUSIC</h1>
    <div class="card">
      <p>
        This page is the placeholder for Roxie's music hub. Later you can add Spotify embeds,
        SoundCloud embeds, album art, lyrics, and release notes.
      </p>

      <div class="track"><strong>Latest Release</strong><br />Add your newest song here.</div>
      <div class="track"><strong>Featured Track</strong><br />Add a favorite or top-performing song here.</div>
      <div class="track"><strong>Album / EP</strong><br />Add album information here.</div>
    </div>
  </div>
</body>
</html>
