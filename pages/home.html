<!DOCTYPE html>
<html>
<head>
  <title>Roxie Xotton</title>

  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      font-family: "Cormorant Garamond", serif;
      overflow: hidden;
      position: relative;
      color: #e8b8ff;
    }

 .bg-video {
  position: fixed;
  top: 50%;
  left: 50%;

  width: 100vw;
  height: 100vh;

  transform: translate(-50%, -50%) scale(2.2);

  border: none;
  z-index: 0;
  pointer-events: none;
}

    .dark-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
      z-index: 1;
      pointer-events: none;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 5;
    }

    .left-fade {
      position: absolute;
      left: 0;
      top: 0;
      width: 17vw;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(
        to right,
        #000 80%,
        rgba(0,0,0,0.95) 88%,
        rgba(0,0,0,0.5) 95%,
        rgba(0,0,0,0)
      );
    }

    /* ===== LEFT COLUMN / SOCIAL BAR - PRESERVED ===== */

    .left-column {
      position: absolute;
      left: 6vw;
      top: 52%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      z-index: 20;
    }

    .music-player {
      width: 240px;
      height: 240px;
      margin-bottom: 10px;
      transform: translateX(-90px) translateY(-320px);
      border: 1px solid rgba(200, 107, 255, 0.35);
      border-radius: 50%;
      overflow: hidden;
      background: rgba(10, 10, 10, 0.55);
      backdrop-filter: blur(4px);
      box-shadow:
        0 0 14px rgba(161, 0, 255, 0.35),
        0 0 28px rgba(161, 0, 255, 0.18);
      position: relative;
    }

    .music-player::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(200, 107, 255, 0.2);
      box-shadow: 0 0 20px rgba(180, 0, 255, 0.3);
      pointer-events: none;
    }

    #musicFrame,
    #musicFrame iframe {
      width: 100% !important;
      height: 100% !important;
      border-radius: 50%;
    }

    .music-player iframe {
      pointer-events: none;
    }

    .social-column {
      position: absolute;
      left: -0.1vw;
      top: 70%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .social-icon {
      width: 58px;
      height: 58px;
      border: 1px solid rgba(200, 107, 255, 0.35);
      border-radius: 14px;
      background: rgba(10, 10, 10, 0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 12px rgba(161, 0, 255, 0.35),
        0 0 24px rgba(161, 0, 255, 0.18);
      transition: 0.2s ease;
    }

    .social-icon:hover {
      transform: scale(1.08);
      border-color: rgba(216, 140, 255, 0.7);
      box-shadow:
        0 0 18px rgba(200, 107, 255, 0.55),
        0 0 32px rgba(200, 107, 255, 0.3);
    }

    .social-icon img {
      width: 28px;
      height: 28px;
      filter:
        brightness(0)
        invert(66%)
        sepia(41%)
        saturate(2442%)
        hue-rotate(239deg);
    }
  </style>
</head>

<body>

<iframe
  class="bg-video"
  src="https://player.mediadelivery.net/play/657051/e2580798-5532-4440-b5ee-921b1c7713ca?autoplay=true&muted=true&loop=true&preload=true"
  allow="autoplay; fullscreen"
  allowfullscreen>
</iframe>

<div class="dark-overlay"></div>

<div class="page">

  <div class="left-fade"></div>

  <div class="left-column">

    <div class="music-player">
      <div id="musicFrame"></div>
    </div>

    <div class="social-column">
      <a href="https://www.instagram.com/roxiexotton/" target="_blank" class="social-icon">
        <img src="../images/icons/instagram.svg">
      </a>

      <a href="https://open.spotify.com/artist/0VDxGgXiZGBfHgMcNGG6f8" target="_blank" class="social-icon">
        <img src="../images/icons/spotify.svg">
      </a>

      <a href="https://www.tiktok.com/@roxiexotton" target="_blank" class="social-icon">
        <img src="../images/icons/tiktok.svg">
      </a>

      <a href="https://www.youtube.com/channel/UCP6750YuNB92aYa4OgwBzCw" target="_blank" class="social-icon">
        <img src="../images/icons/youtube.svg">
      </a>

      <a href="https://www.facebook.com/roxiexotton/" target="_blank" class="social-icon">
        <img src="../images/icons/facebook.svg">
      </a>
    </div>

  </div>

</div>

<script>
  const videos = ["UgSbS39BnSc","FMOFix9Zk2A","i_K3ppIzwr8"];
  let player;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player("musicFrame", {
      videoId: videos[Math.floor(Math.random() * videos.length)],
      playerVars: {
        autoplay: 1,
        mute: 1,
        controls: 0,
        modestbranding: 1,
        rel: 0
      }
    });
  }
</script>

</body>
</html>
