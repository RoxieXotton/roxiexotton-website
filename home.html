<!DOCTYPE html>
<html>
<head>
  <title>Home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-image: url("homebg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.15);
      z-index: 1;
    }

    .button-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -32%);
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 340px;
      z-index: 2;
    }

    .button-container a {
      display: block;
      width: 100%;
      height: 64px;
      border-radius: 12px;
      text-indent: -9999px;
      overflow: hidden;
      background: transparent;
    }

    @media (max-width: 768px) {
      body {
        background-position: center;
      }

      .button-container {
        width: 280px;
        transform: translate(-50%, -28%);
      }

      .button-container a {
        height: 54px;
      }
    }
  </style>
</head>
<body>
  <div class="button-container">
    <a href="music.html">Music</a>
    <a href="pics.html">Pics</a>
    <a href="lore.html">Lore</a>
    <a href="vip.html">VIP</a>
  </div>
</body>
</html>
