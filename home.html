<!DOCTYPE html>
<html>
<head>
  <title>Home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-image: url("homebg.png");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.15);
      z-index: 1;
    }

    .video-container {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      aspect-ratio: 9 / 16;
      border-radius: 14px;
      overflow: hidden;
      z-index: 10;
      box-shadow:
        0 0 18px rgba(212, 76, 255, 0.5),
        0 0 35px rgba(139, 0, 255, 0.25);
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .button-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 50%);
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 275px;
      z-index: 10;
    }

    .button-container a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 52px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: linear-gradient(to bottom, #d63bff, #8b00ff);
      border: 2px solid #c44dff;
      box-shadow:
        0 0 12px rgba(212, 76, 255, 0.7),
        inset 0 0 10px rgba(255, 255, 255, 0.15);
      transition: 0.2s ease;
      position: relative;
      z-index: 20;
    }

    .button-container a:hover {
      transform: scale(1.03);
      background: linear-gradient(to bottom, #eb6cff, #a100ff);
      box-shadow:
        0 0 18px rgba(212, 76, 255, 0.9),
        inset 0 0 12px rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 768px) {
      body {
        background-size: cover;
        background-position: center;
      }

      .video-container {
        width: 220px;
        top: 14%;
      }

      .button-container {
        width: 235px;
        transform: translate(-50%, -22%);
        gap: 12px;
      }

      .button-container a {
        height: 46px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="video-container">
    <iframe 
      src="https://www.youtube.com/embed/dQ2fNorrgao"
      title="Roxie Video"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <div class="button-container">
    <a href="videos.html">Videos</a>
    <a href="pics.html">Pics</a>
    <a href="music.html">Music</a>
    <a href="lore.html">Lore</a>
  </div>
</body>
</html>
