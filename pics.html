<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pics | Roxie Xotton</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      padding: 40px 20px;
    }
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    p {
      color: #ddd;
      line-height: 1.7;
    }
    .back {
      display: inline-block;
      margin-bottom: 24px;
      color: #f66;
      text-decoration: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }
    .box {
      background: #111;
      border: 1px solid #300;
      border-radius: 12px;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Back</a>
    <h1>PICS</h1>
    <p>
      This is the placeholder gallery page. Replace these boxes with real Roxie images later.
    </p>

    <div class="grid">
      <div class="box">Image Slot 1</div>
      <div class="box">Image Slot 2</div>
      <div class="box">Image Slot 3</div>
      <div class="box">Image Slot 4</div>
    </div>
  </div>
</body>
</html>
