<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roxie Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
    }

  .page {
  position: relative;
  min-height: 100vh;
  background-image: url("bg.png");
  background-size: cover;
  background-position: 50% center;
  background-repeat: no-repeat;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  overflow: hidden;
}

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(0,0,0,0.00) 35%,
        rgba(0,0,0,0.25) 52%,
        rgba(0,0,0,0.75) 70%,
        rgba(0,0,0,0.95) 85%,
        rgba(0,0,0,1) 100%
      );
      z-index: 1;
    }

  .login-wrap {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 390px;
  margin-right: 2vw;
}

 .login-box {
  background: rgba(10, 10, 10, 0.72);
  border: 1px solid rgba(160, 0, 255, 0.35);
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 0 25px rgba(160, 0, 255, 0.18);
  backdrop-filter: blur(4px);
}ackdrop-filter: blur(4px);
    }

    h1 {
      font-size: 40px;
      color: #c86bff;
      margin-bottom: 8px;
    }

    .sub {
      color: #aaa;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #111;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #a100ff;
      color: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background: #c03cff;
    }

    #message {
      margin-top: 15px;
      color: #ff66ff;
      min-height: 20px;
    }

    @media (max-width: 900px) {
      .page {
        justify-content: center;
        background-position: center;
      }

      .page::before {
        background: rgba(0,0,0,0.72);
      }

      .login-wrap {
        margin-right: 0;
        padding: 20px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="login-wrap">
      <div class="login-box">
        <h1>Roxie Members</h1>
        <div class="sub">MEMBER ACCESS</div>

        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Password" />

        <button onclick="signUp()">Sign Up</button>
        <button onclick="signIn()">Log In</button>

        <p id="message"></p>
      </div>
    </div>
  </div>

  <script>
    const supabaseUrl = "https://ghfjfuewrmtkoqcqcujo.supabase.co";
    const supabaseKey = "sb_publishable_DYIDai05yxMKsJbyU9K_pA_AxfdmSII";

    const client = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function signUp() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await client.auth.signUp({
        email,
        password
      });

      document.getElementById("message").innerText =
        error ? error.message : "Signup successful";
    }

    async function signIn() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        document.getElementById("message").innerText = error.message;
      } else {
        window.location.href = "home.html";
      }
    }
  </script>
</body>
</html>
