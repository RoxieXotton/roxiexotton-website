    * {
      box-sizing: border-box;

    body {

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background-image: url("../images/bg/bg.png");
      background-size: 70%;
      background-position: center center;
      background-repeat: no-repeat;
      overflow: hidden;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("../images/bg/bg.png");
      background-size: 70%;
      background-position: center center;
      background-repeat: no-repeat;
      pointer-events: none;
      opacity: 0;
    }

    .page::before {
      mix-blend-mode: screen;
      animation: glitchRed 7s infinite;
    }

    .page::after {
      mix-blend-mode: screen;
      animation: glitchBlue 7s infinite;
    }

    @keyframes glitchRed {
      0%, 88%, 100% {
        opacity: 0;
        transform: translate(0, 0);
        filter: none;
      }
      89% {
        opacity: 0.9;
        transform: translate(-18px, 6px);
        filter: hue-rotate(-40deg) saturate(3) brightness(1.2);
      }
      89.5% {
        opacity: 0.7;
        transform: translate(14px, -8px);
        filter: hue-rotate(-60deg) saturate(5) contrast(2);
      }
      90% {
        opacity: 0.95;
        transform: translate(-25px, 10px) skewX(6deg);
        filter: hue-rotate(-90deg) saturate(5) brightness(1.4);
      }
      90.5% {
        opacity: 0;
        transform: translate(0, 0);
        filter: none;
      }
      94% {
        opacity: 0.75;
        transform: translate(12px, -4px);
        filter: hue-rotate(-30deg) saturate(4);
      }
      94.5% {
        opacity: 0;
        transform: translate(0, 0);
        filter: none;
      }
    }

    @keyframes glitchBlue {
      0%, 88%, 100% {
        opacity: 0;
        transform: translate(0, 0);
        filter: none;
      }
      89% {
        opacity: 0.8;
        transform: translate(20px, -5px);
        filter: hue-rotate(180deg) saturate(4) brightness(1.15);
      }
      89.4% {
        opacity: 0.9;
        transform: translate(-12px, 8px);
        filter: hue-rotate(220deg) saturate(6) contrast(2);
      }
      90% {
        opacity: 1;
        transform: translate(28px, -10px) skewY(-4deg);
        filter: hue-rotate(250deg) saturate(6) brightness(1.3);
      }
      90.5% {
        opacity: 0;
        transform: translate(0, 0);
        filter: none;
      }
      94% {
        opacity: 0.8;
        transform: translate(-10px, 4px);
        filter: hue-rotate(210deg) saturate(4);
      }
      94.5% {
        opacity: 0;
        transform: translate(0, 0);
        filter: none;
      }
    }
