<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roxie Xotton</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      max-width: 900px;
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    p {
      color: #ccc;
      max-width: 700px;
      margin: 0 auto 30px;
      line-height: 1.6;
    }
    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 30px;
    }
    .btn {
      display: inline-block;
      min-width: 180px;
      padding: 18px 24px;
      border: 1px solid #a00;
      color: #fff;
      text-decoration: none;
      background: #111;
      border-radius: 12px;
      font-size: 1.1rem;
      transition: 0.2s ease;
    }
    .btn:hover {
      background: #1a1a1a;
      transform: translateY(-2px);
      box-shadow: 0 0 18px rgba(255, 0, 0, 0.25);
    }
    .footer {
      margin-top: 40px;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ROXIE XOTTON</h1>
    <p>
      AI goth pop star. Music, lore, and visuals from the world of Roxie and Xotton.
    </p>

    <div class="buttons">
      <a class="btn" href="lore.html">Lore</a>
      <a class="btn" href="music.html">Music</a>
      <a class="btn" href="pics.html">Pics</a>
    </div>

    <div class="footer">
      roxiexotton.com
    </div>
  </div>
</body>
</html>
